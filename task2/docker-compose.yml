services:
  app:
    build: .
    container_name: lab3-app-task2
    ports:
      - "5000:5000"
      - "8000:8000"
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: lab3-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'